services:

  # ─── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: voavoa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${EVOLUTION_POSTGRES_DB:-evolution}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - voavoa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: voavoa-redis
    restart: unless-stopped
    networks:
      - voavoa-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Evolution API ─────────────────────────────────────────────
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Autenticação
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY:?Configure EVOLUTION_API_KEY in .env}"

      # Banco de dados
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}?schema=public"

      # Cache (Redis)
      CACHE_REDIS_URI: "redis://redis:6379/1"

      # Configurações gerais
      SERVER_PORT: 8080
      LOG_LEVEL: ERROR
      LOG_COLOR: "true"
      DEL_INSTANCE: "false"
    networks:
      - voavoa-net

  # ─── Bot de WhatsApp (webhook da Evolution API) ─────────────────
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: voavoa-whatsapp-bot
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "127.0.0.1:5050:5000"
    depends_on:
      - evolution-api
    networks:
      - voavoa-net

# ─── Volumes persistentes ───────────────────────────────────────
volumes:
  postgres_data:

# ─── Rede interna ───────────────────────────────────────────────
networks:
  voavoa-net:
    driver: bridge
