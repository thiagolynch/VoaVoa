name: Varredura diária de preços

on:
  schedule:
    - cron: "17 10 * * *"   # 07:17 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: voavoa-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
      EVOLUTION_INSTANCE_NAME: ${{ secrets.EVOLUTION_INSTANCE_NAME }}
      EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
      VITRINE_ORIGENS: ${{ vars.VITRINE_ORIGENS || 'GRU,GIG' }}
      VITRINE_BUSCAS_POR_EXECUCAO: ${{ vars.VITRINE_BUSCAS_POR_EXECUCAO || '6' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Atualizar página pública
        run: python vitrine.py

      - name: Verificar alertas de WhatsApp
        if: ${{ env.DATABASE_URL != '' }}
        run: python motor_busca.py

      - name: Salvar preços no repositório
        run: |
          git config user.name "voavoa-bot"
          git config user.email "voavoa-bot@users.noreply.github.com"
          git add site/data/precos.json
          git diff --cached --quiet || git commit -m "Preços atualizados $(date -u +%F)"
          git push

  deploy:
    needs: scan
    uses: ./.github/workflows/pages.yml
